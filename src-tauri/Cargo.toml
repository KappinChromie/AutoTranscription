[package]
name = "live-transcriber"
version = "0.1.0"
edition = "2021"

[lib]
name = "live_transcriber_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# Audio Capture & Lock-Free Buffers
wasapi = "0.26.0"
rtrb = "0.3"
rubato = "5.0"

# Process Enumeration for App Selector
sysinfo = "0.33"

# Concurrency & Channels
crossbeam-channel = "0.5"
parking_lot = "0.12"

# Speech-to-Text & Speaker Embeddings
sherpa-rs = { version = "0.6.8", features = ["download-binaries"] }
sherpa-rs-sys = { version = "0.6.8", features = ["download-binaries"] }

# ONNX Runtime for Pyannote Segmentation Powerset
ort = { version = "2.0.0-rc.15", features = ["download-binaries"] }
ndarray = "0.17"

# Native Agglomerative Hierarchical Clustering (AHC)
kodama = "0.3"

# Model downloading & extraction
ureq = { version = "2.12", features = ["tls"] }
tar = "0.4"
bzip2-rs = "0.1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
